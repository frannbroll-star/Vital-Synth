name: Build Vital iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Unsigned Archive
        run: |
          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -project "$PROJECT" | awk '/Schemes:/,0' | sed '1d' | head -n 1 | xargs)
          xcodebuild -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Vital.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Vital.xcarchive/Products/Applications/*.app Payload/
          zip -r Vital-Synth-Mod.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vital-Synth-Mod-IPA
          path: Vital-Synth-Mod.ipa
